[project]
name = "pii-ner-sidecar"
version = "0.1.0"
description = "Statistical PII detection for the Model Gateway data plane, over a Unix socket."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]

[project.optional-dependencies]
# Presidio pulls spaCy and a language model — hundreds of megabytes. Optional
# so the sidecar runs, and its boundary can be tested, without them.
presidio = ["presidio-analyzer>=2.2"]

[project.scripts]
pii-ner = "pii_ner.main:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28", "mypy>=1.13", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_ner"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]
