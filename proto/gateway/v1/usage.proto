syntax = "proto3";

// The usage event: one record per request, produced by the data plane and
// consumed by the control plane's accounting.
//
// It is a separate schema from the snapshot because the two travel in opposite
// directions and change for unrelated reasons. A snapshot is configuration
// pushed out; this is measurement flowing back.
//
// The stream is the source of truth for cost, so the same append-only
// compatibility rules apply: never reuse or renumber a tag, and a reader must
// tolerate fields it does not understand — during a rollout, a consumer older
// than its producers is normal.
package gateway.v1;

option go_package = "github.com/umerjavaidkh/model-gateway/dataplane/internal/wire/gatewayv1";

// TokenUsage is what a request consumed, by billing class.
//
// The classes are disjoint: input excludes cached_input and cache_write. That
// is a normalisation the provider adapters perform, because providers disagree
// about whether cached tokens are counted inside the input total or beside it,
// and no consumer should have to know which one produced a record.
message TokenUsage {
  int64 input = 1;
  int64 cached_input = 2;
  int64 cache_write = 3;
  int64 output = 4;
}

// UsageEvent is one served request.
//
// Emitted on every exit path, including refusals: a request rejected at
// admission consumed a slot worth counting, and one that failed after routing
// may already have burned tokens a provider will bill for.
message UsageEvent {
  // request_id is the trace id when tracing is on, so one string finds the
  // trace, this record and the log line.
  string request_id = 1;
  int64 timestamp_unix_ms = 2;

  string tenant = 3;
  string key_id = 4;
  // tier is the tenant's plan tier. Safe as a metrics label, unlike tenant.
  string tier = 5;

  string deployment = 6;
  string base_model = 7;
  string adapter_id = 8;
  string provider = 9;
  bool stream = 10;

  TokenUsage usage = 11;

  // cost is what the provider charges us; price is what the tenant is charged.
  // Equal until a rate card exists, and separate because budgets are enforced
  // against price and a negotiated rate makes them diverge.
  int64 cost_micro_usd = 12;
  int64 price_micro_usd = 13;

  int64 latency_ms = 14;
  int64 time_to_first_byte_ms = 15;
  // outcome is empty on success, and otherwise the gateway's error code.
  string outcome = 16;

  // snapshot_version records which configuration served the request. Without
  // it, "why did this route there" is unanswerable after a rollout.
  uint64 snapshot_version = 17;

  // budget_ids are the budgets this request must be charged against, captured
  // when it was served rather than looked up later. A budget detached from a
  // key afterwards would otherwise lose the spend that was incurred while it
  // was attached, and the arithmetic would quietly stop matching the invoice.
  repeated string budget_ids = 18;

  // shadow marks a mirrored request: one nobody was waiting for, whose answer
  // was discarded. It cost real money and belongs in the record, but it is not
  // traffic anybody was served — so accounting must be able to tell it apart
  // rather than charging a tenant for requests they did not make.
  bool shadow = 19;

  // stages is how long each leg of the request took, in the order they ran.
  // Carried on the event because a trace answers "what happened to this
  // request" and this answers "which stage is slow across a thousand of
  // them" — and it survives without a trace backend.
  repeated StageTiming stages = 20;
}

// StageTiming is one leg of the request path and what it cost.
message StageTiming {
  // name is the stage: authenticate, admit, guard, route, adapt.
  string name = 1;
  uint32 duration_ms = 2;
  // outcome is empty when the stage passed, and otherwise the code it refused
  // with. A stage that refused is where the request ended.
  string outcome = 3;
}

// AuditEvent records a decision, where a UsageEvent records a measurement.
//
// That is the line between the two, and it is why they are separate messages on
// separate streams rather than one message with optional fields: a refusal, a
// redaction and a configuration change are things somebody decided, and they
// are kept append-only with a hash chain and their own retention clock. Token
// counts are things that happened, and they are aggregated and expired.
//
// The chain itself is not on this message. Two workers publishing concurrently
// would each need the previous record's hash to compute their own, and there is
// no previous record until one of them is written — so the chain is computed by
// the single consumer that appends, not by the producers.
message AuditEvent {
  // event_id makes the record idempotent under at-least-once delivery. The
  // request id cannot: one request can produce a refusal and a redaction, and
  // a configuration change has no request at all.
  string event_id = 1;
  // request_id is empty for actions that were not a request — a key rotation,
  // a policy publication.
  string request_id = 2;
  int64 timestamp_unix_ms = 3;

  string tenant = 4;
  // actor is who did it: a key id, a user subject, or a service-account name.
  string actor = 5;
  // action is what they did: "chat.completions", "key.issue", "policy.publish".
  string action = 6;
  // resource is what they did it to: a model, a deployment, a component.
  string resource = 7;
  // outcome is empty when the action was allowed, and otherwise the code it
  // was refused with.
  string outcome = 8;
  // reason is the human-readable half of the outcome: which guardrail refused,
  // which rule matched. Never the payload that triggered it — the audit tap
  // sits after redaction precisely so this table does not become a copy of the
  // data it exists to protect.
  string reason = 9;

  // source_ip is the caller's address, for the "who and from where" an
  // investigation starts from.
  string source_ip = 10;
  // snapshot_version is the configuration in force when the decision was made,
  // which is what makes "why was this allowed in March" answerable.
  uint64 snapshot_version = 11;
}
