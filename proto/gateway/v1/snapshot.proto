syntax = "proto3";

// The snapshot wire format: the contract between the Python control plane that
// compiles configuration and the Go data plane that serves requests from it.
//
// This is deliberately NOT the same as the Go domain types in internal/core.
// Domain types are shaped for the request path and are refactored freely; wire
// types are append-only and backward-compatible forever. Collapsing the two
// would make every internal rename a wire-compatibility question.
//
// Compatibility rules for anyone editing this file:
//   - Never reuse or renumber a field tag. Use `reserved` when removing one.
//   - New fields are always optional in effect: an older worker must be able to
//     read a newer layer and ignore what it does not understand, because during
//     a rollout both versions are live at once.
//   - Enums always keep an UNSPECIFIED zero value, so a value added later
//     arrives as "unspecified" rather than being silently read as the first
//     real variant.
package gateway.v1;

option go_package = "github.com/umerjavaidkh/model-gateway/dataplane/internal/wire/gatewayv1";

// LayerVersion identifies one build of one layer. Number orders versions;
// digest content-addresses the bytes so a worker can skip a re-fetch and two
// workers claiming the same version can be proven to hold the same layer.
message LayerVersion {
  uint64 number = 1;
  string digest = 2;
}

enum TrustTier {
  TRUST_TIER_UNSPECIFIED = 0;
  TRUST_TIER_EXTERNAL = 1;
  TRUST_TIER_PRIVATE_CLOUD = 2;
  TRUST_TIER_INTERNAL = 3;
}

enum BudgetScope {
  BUDGET_SCOPE_UNSPECIFIED = 0;
  BUDGET_SCOPE_KEY = 1;
  BUDGET_SCOPE_APP = 2;
  BUDGET_SCOPE_USER = 3;
  BUDGET_SCOPE_TEAM = 4;
  BUDGET_SCOPE_ORG = 5;
  BUDGET_SCOPE_MODEL = 6;
  BUDGET_SCOPE_TRAINING = 7;
}

enum Port {
  PORT_UNSPECIFIED = 0;
  PORT_PROVIDER = 1;
  PORT_GUARDRAIL = 2;
  PORT_STORE = 3;
  PORT_TELEMETRY = 4;
}

// RoutingKey is (base model, adapter). Adapter is empty for a plain base model.
// Multi-LoRA serving means one base deployment serves many adapters, so this is
// the routing table's key from the first release rather than a bare model name.
message RoutingKey {
  string base_model = 1;
  string adapter_id = 2;
}

// Cost is what a deployment charges, per thousand tokens of each class.
//
// Millionths of a US dollar, integer, never floating point: per-token prices
// are small enough that float rounding reaches the invoice.
//
// The classes exist because providers do not bill all input tokens the same.
// Cached input is an order of magnitude cheaper, and writing to a cache is
// dearer than a plain read. Recording only a single input rate means a request
// that was 90% cache reads is billed as though it were not — and the provider
// told us the truth exactly once, in a response we did not keep.
message Cost {
  int64 input_per_1k_micro_usd = 1;
  int64 output_per_1k_micro_usd = 2;
  // Zero means unconfigured, and the caller falls back to the standard input
  // rate. Falling back over-bills slightly rather than under-billing, which is
  // the safe direction for a number a customer disputes.
  int64 cached_input_per_1k_micro_usd = 3;
  int64 cache_write_per_1k_micro_usd = 4;
}

message Deployment {
  string id = 1;
  RoutingKey key = 2;
  string provider = 3;
  string endpoint = 4;
  string region = 5;
  TrustTier trust_tier = 6;
  // A reference to a secret, never the secret. Provider credentials must not
  // enter a snapshot: snapshots are replicated to every worker, cached and
  // versioned. Workers resolve the reference separately and cache with a TTL.
  string credential_ref = 7;
  // Share of traffic, 0-100. Zero means registered but not serving — the state
  // a fine-tuned adapter sits in while it takes shadow traffic.
  uint32 weight = 8;
  // Share of the *base model's* traffic mirrored to this deployment, 0-100.
  // A separate dimension from weight: an adapter in shadow serves nobody
  // (weight 0) while seeing real requests, and the response is discarded.
  //
  // Sampled rather than all-or-nothing because mirroring doubles inference
  // spend for whatever fraction it covers, and a shadow that costs as much as
  // production is one an operator turns off.
  uint32 shadow_percent = 11;
  Cost cost = 9;
  repeated string capabilities = 10;
}

message ModelAlias {
  string name = 1;
  repeated RoutingKey targets = 2;
}

// FailureMode is what to do when a guardrail errors or exceeds its budget.
enum FailureMode {
  FAILURE_MODE_UNSPECIFIED = 0;
  // Allow the request. For detection that is useful but not authoritative —
  // prompt-injection heuristics are the example the design names, because
  // shipping them as a blocking control buys an outage risk in exchange for
  // security theatre.
  FAILURE_MODE_OPEN = 1;
  // Refuse the request. For controls where the failure is not recoverable: a
  // leaked credential cannot be un-leaked.
  FAILURE_MODE_CLOSED = 2;
}

// PolicyEffect is what a matching rule does.
enum PolicyEffect {
  POLICY_EFFECT_UNSPECIFIED = 0;
  POLICY_EFFECT_ALLOW = 1;
  POLICY_EFFECT_DENY = 2;
}

// PolicyRule is one row of the compiled decision table.
//
// Every condition is a set the attribute must be in, and an empty set matches
// anything. All present conditions must hold, so a rule reads as a conjunction
// and can be understood without reference to any other rule.
//
// This is deliberately not a language: no negation, no recursion, no joins, no
// data documents. See docs/adr/0006-compiled-policy-not-a-policy-language.md.
message PolicyRule {
  string id = 1;
  PolicyEffect effect = 2;

  // Conditions. Empty means "any".
  repeated string models = 3;
  repeated string endpoints = 4;
  repeated string roles = 5;
  repeated string regions = 6;
  // source_cidrs are CIDR blocks the caller's address must fall inside.
  repeated string source_cidrs = 7;
  // max_payload_bytes is an upper bound; zero means no bound.
  uint64 max_payload_bytes = 8;

  // Effects applied when an allow rule matches. Stamping here is what lets
  // policy decide sensitivity, which the router then turns into a destination
  // constraint — the ordering the design requires.
  string data_class = 9;
  TrustTier min_trust_tier = 10;

  // deep_inspection asks for the statistical detection tier as well as the
  // deterministic one. Opt-in per rule rather than derived from the data
  // class, because it costs tens of milliseconds and an operator should be
  // choosing to spend that rather than discovering they are.
  bool deep_inspection = 12;

  // reason is returned to the caller on a denial. It is written by an operator
  // and is expected to be safe to disclose.
  string reason = 11;
}

// PolicyBundle is the compiled decision table.
//
// Compiled in the control plane, never interpreted per request: a gateway that
// parses policy on every request has put a language runtime in its hot path,
// which is what the snapshot model exists to avoid.
message PolicyBundle {
  string id = 1;
  uint64 version = 2;
  // Rules in evaluation order. First match wins, which makes an ordering
  // an operator can read the whole of the conflict-resolution semantics.
  repeated PolicyRule rules = 3;
  // default_effect applies when no rule matches. Allow, because policy is one
  // control among several and a bundle that denied by default would make
  // adding the feature an outage.
  PolicyEffect default_effect = 4;
}

// GuardrailBinding is one guardrail and the budget it is admitted under.
//
// A list rather than one binding per port, because a tenant genuinely runs
// several: a secret scan that blocks, an injection heuristic that only alerts,
// a content policy. Modelling it as one-per-port would have forced them into
// one component and made their budgets indistinguishable.
message GuardrailBinding {
  string component = 1;
  string version = 2;
  string config_ref = 3;
  // timeout_ms is enforced by the caller rather than trusted to the
  // implementation. A guardrail that hangs must not be able to hang the
  // request, and asking it to police itself assumes the thing that failed.
  uint32 timeout_ms = 4;
  FailureMode failure_mode = 5;
  // blocking guardrails run inline and can refuse or rewrite. Non-blocking
  // ones run off the request path on a copy and can only alert — which is the
  // honest shape for anything whose accuracy does not justify refusing real
  // traffic.
  bool blocking = 6;
  // phases the guardrail inspects. Empty means the request leg only.
  repeated string phases = 7;
  // execution is how the worker must run this component: "builtin" for one
  // compiled in, "sidecar" for a process on a socket, "in_process" for a WASM
  // module. Carried here because the snapshot is the worker's only source of
  // configuration — a worker that had to ask something else how to run a
  // bound component would stop serving when that something else was down.
  string execution = 8;
  // module is the sha256 digest of the WASM module, for in_process
  // components. The worker verifies the bytes against it before compiling:
  // the admission record vouches for these bytes and no others.
  string module = 9;
}

message PluginBinding {
  Port port = 1;
  string component = 2;
  string version = 3;
  string config_ref = 4;
}

message BudgetState {
  string id = 1;
  BudgetScope scope = 2;
  int64 limit_micro_usd = 3;
  int64 spent_micro_usd = 4;
  bool hard = 5;
  // Basis points of the limit held back so requests already streaming when the
  // budget tips can finish without overshooting. 500 = 5%.
  uint32 headroom_basis_points = 6;
}

message BudgetRef {
  string id = 1;
  BudgetScope scope = 2;
}

// RateLimit is what a principal may consume per window.
//
// Zero means unlimited for that dimension, which is the only sane default: a
// principal created before a limit existed must not suddenly be capped at zero.
message RateLimit {
  // Requests admitted per minute.
  uint32 requests_per_minute = 1;
  // Tokens per minute, counted from reported usage, so it necessarily lags by
  // one request. Approximate by construction and documented as such.
  uint32 tokens_per_minute = 2;
  // Requests in flight at once. Enforced per worker, so the fleet-wide figure
  // is this multiplied by worker count — stated rather than pretended away.
  uint32 max_concurrent = 3;
}

message Principal {
  string key_id = 1;
  string tenant = 2;
  string org = 3;
  string team = 4;
  string user = 5;
  string app = 6;
  repeated string roles = 7;
  // allow_all is explicit rather than implied by an empty list, so that an
  // empty allowlist means "nothing" and a builder that forgets to populate it
  // fails closed.
  bool models_allow_all = 8;
  repeated string models = 9;
  repeated BudgetRef budgets = 10;
  string default_data_class = 11;
  TrustTier min_trust_tier = 12;
  uint32 max_concurrent = 13;
  // The outgoing generation of a rotated key stays valid until not_after, with
  // a warning header, so rotation is a non-event for callers.
  bool deprecated = 14;
  int64 not_after_unix_ms = 15;
  // Field 16: max_concurrent above is retained at 13 for compatibility and is
  // superseded by limits.max_concurrent. A field tag is never reused.
  RateLimit limits = 16;
}

// KeyEntry maps a key's lookup value to the principal it resolves to. The
// lookup is HMAC-SHA256 of the key secret under a pepper the worker holds and
// the snapshot never carries, so a stolen snapshot yields no usable key.
message KeyEntry {
  bytes lookup = 1;
  string key_id = 2;
}

// GlobalLayer is the tenant-independent half of a snapshot: large, and changes
// rarely.
message GlobalLayer {
  LayerVersion version = 1;
  int64 built_at_unix_ms = 2;
  repeated Deployment deployments = 3;
  repeated ModelAlias aliases = 4;
  // Routes an API key's prefix segment to a tenant, so principal lookup is one
  // probe into one tenant's map rather than a scan across every tenant.
  map<string, string> tenant_prefixes = 5;
  repeated PluginBinding default_plugins = 6;
  string policy_bundle_ref = 7;
  // Guardrails applied to any tenant that declares none of its own.
  repeated GuardrailBinding default_guardrails = 8;
  // The fleet-wide compiled policy, applied to tenants with none of their own.
  PolicyBundle default_policy = 9;
}

// TenantLayer is one tenant's slice: small, and changes constantly. It is
// versioned and shipped independently of the global layer, so a budget edit
// does not reship the catalog to every worker.
message TenantLayer {
  string tenant = 1;
  LayerVersion version = 2;
  int64 built_at_unix_ms = 3;
  // Plan tier. Safe as a metrics label, unlike the tenant id, which is
  // unbounded cardinality and will take Prometheus down.
  string tier = 4;
  repeated Principal principals = 5;
  repeated KeyEntry keys = 6;
  repeated ModelAlias alias_overrides = 7;
  repeated BudgetState budgets = 8;
  repeated PluginBinding plugins = 9;
  TrustTier min_trust_tier = 10;
  // Guardrails for this tenant. A tenant that declares any replaces the fleet
  // defaults entirely rather than merging with them: merging two lists of
  // things that can refuse traffic produces a set nobody can predict, and
  // "which guardrails am I actually running" must have a simple answer.
  repeated GuardrailBinding guardrails = 11;
  // This tenant's compiled policy. Replaces the fleet default rather than
  // merging, for the same reason guardrails do: two ordered rule lists merged
  // produce an order nobody can predict.
  PolicyBundle policy = 12;
}

// Snapshot is a global layer plus the tenant layers composed onto it. Layers
// are also transferable on their own; this message is the full-fetch form used
// on worker startup and after a watch stream gap.
message Snapshot {
  // Named global_layer rather than global: the field name is not on the wire —
  // tag numbers are — but `global` is a reserved word in Python, which makes
  // the generated binding reachable only through getattr(). A name that is
  // awkward in one of the two languages that must read this is the wrong name.
  GlobalLayer global_layer = 1;
  repeated TenantLayer tenants = 2;
}
