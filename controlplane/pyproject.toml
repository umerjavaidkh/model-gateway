[project]
name = "model-gateway-control"
version = "0.1.0"
description = "Control plane for the Model Gateway: registry, identity, policy authoring, snapshot compilation."
requires-python = ">=3.12"
dependencies = [
    "protobuf>=5.28",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
gatewayctl = "model_gateway_control.cli:main"
gateway-admin = "model_gateway_control.admin_main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-protobuf>=5.28",
    # SQLite is the fast local target for the repository suite; CI runs the
    # same tests against Postgres, which is the gate.
    "aiosqlite>=0.20",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_gateway_control"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Generated protobuf bindings are not ours to lint or reformat; regenerating
# would undo any change made here.
extend-exclude = [
    # Generated protobuf bindings are not ours to lint or reformat; regenerating
    # would undo any change made here.
    "src/model_gateway_control/wire/snapshot_pb2.py",
    "src/model_gateway_control/wire/snapshot_pb2.pyi",
    # Migrations are append-only historical records, mostly written by Alembic's
    # autogenerate. Reformatting one that has already been applied somewhere
    # changes a file whose value is that it has not changed.
    "src/model_gateway_control/db/migrations/versions",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]
exclude = [
    "src/model_gateway_control/wire/snapshot_pb2\\.pyi?$",
    "src/model_gateway_control/db/migrations/versions/",
]

[[tool.mypy.overrides]]
# The generated bindings are typed by a stub protoc writes, which does not
# satisfy strict mode. Trusting them is the same call as not linting them.
module = "model_gateway_control.wire.snapshot_pb2"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# The test package imports its own fixtures module, so the root must be on the
# path rather than relying on rootdir inference.
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "postgres: needs a real Postgres; skipped unless GATEWAY_TEST_DATABASE_URL is set",
]
