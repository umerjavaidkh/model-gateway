# Automated first-pass review. Everything here runs on GITHUB_TOKEN alone —
# no API keys, no paid services — and posts findings as inline PR comments so
# they land where the code is rather than in a log a reviewer has to open.
name: Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  go:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: dataplane/go.mod
      - uses: reviewdog/action-golangci-lint@v2
        with:
          workdir: dataplane
          reporter: github-pr-review
          # Comment on everything the PR touches, not only changed lines: a
          # config change can break a file the diff never mentions.
          filter_mode: nofilter
          fail_level: error

  python:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-setup@v1
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: ruff
        working-directory: controlplane
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv sync --frozen
          uv run ruff check --output-format=rdjson . \
            | reviewdog -f=rdjson -reporter=github-pr-review -fail-level=error

  actions:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A broken workflow is the one failure that hides every other failure.
      - uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-pr-review
          fail_level: error
