name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dataplane:
    name: Data plane (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dataplane
    # The KVStore contract suite runs against an in-process emulator for speed
    # and against a real Redis here, which is the gate. An emulator is not the
    # thing being deployed — its Lua interpreter and its TTL semantics are
    # reimplementations, and reimplementations differ.
    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379
    env:
      GATEWAY_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: dataplane/go.mod
          cache-dependency-path: dataplane/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # internal/core is the vocabulary every package speaks. One import of an
      # HTTP client or a driver turns the domain model into that library's, and
      # the coupling is invisible until something needs replacing.
      - name: core imports only the standard library
        working-directory: .
        run: ./scripts/check-core-imports.sh
      - run: go vet ./...
      # -race because the snapshot's whole design is concurrent reads of
      # immutable state. A data race here is the one bug class we cannot ship.
      - run: go test -race -count=1 ./...
      # Coverage is measured module-wide with cross-package attribution, so a
      # helper exercised only by another package's tests still counts. Failing
      # the build is what keeps the number from drifting down unnoticed.
      - name: Coverage gate
        working-directory: .
        run: ./scripts/coverage.sh

  proto:
    name: Generated code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: dataplane/go.mod
      - uses: arduino/setup-protoc@v3
        with:
          version: "25.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install protoc-gen-go at the module's protobuf version
        working-directory: dataplane
        run: |
          version="$(go list -m -f '{{.Version}}' google.golang.org/protobuf)"
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${version}"
      # Generated code is committed so the build needs no toolchain. That only
      # holds if it actually matches the .proto, which is what this checks.
      - run: make proto
      - name: Fail if regenerating changed anything
        run: git diff --exit-code || { echo "::error::run 'make proto' and commit the result"; exit 1; }

  crosslanguage:
    name: Cross-language and live subscription
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: dataplane/go.mod
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - working-directory: controlplane
        run: uv sync --frozen
      # Unit tests on either side can both pass while the two disagree about
      # the bytes. This is the only check that catches that.
      - run: ./scripts/cross-language-check.sh
      # The file-based check proves the two languages agree on the bytes. This
      # proves configuration actually reaches a running worker, and that traffic
      # survives the control plane going away — a claim that is otherwise only
      # in a design document.
      - run: ./scripts/live-subscription-check.sh
        env:
          # Exercises the Redis limiter path end to end, not only in unit tests.
          GATEWAY_TEST_REDIS_URL: redis://localhost:6379

  controlplane:
    name: Control plane (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controlplane
    # The suite runs against SQLite locally for speed, but Postgres is what runs
    # in production and therefore what gates a merge. Testing only on SQLite
    # while deploying on Postgres is a well-known way to find schema problems in
    # production rather than in CI.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gateway_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      GATEWAY_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gateway_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
