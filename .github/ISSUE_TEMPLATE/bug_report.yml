name: Bug report
description: Something behaves differently from what the design says it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security issues do not belong here.** Report them privately — see
        [SECURITY.md](https://github.com/umerjavaidkh/model-gateway/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest sequence that shows it. A failing test is ideal.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations: { required: true }
  - type: textarea
    id: context
    attributes:
      label: Context
      description: |
        Snapshot version if relevant, request ID, trace ID, relevant logs.
        Redact credentials and payloads before pasting.
